name: Dynamic Bound Read Bridge
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bridge-dynamic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-dynamic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Record selected toolchain
        shell: bash
        run: |
          command -v cmake ninja "$CC" "$CXX" | tee bridge-toolchain.log
          cmake --version | tee -a bridge-toolchain.log
          ninja --version | tee -a bridge-toolchain.log
          "$CC" --version | tee -a bridge-toolchain.log
          "$CXX" --version | tee -a bridge-toolchain.log
      - name: Configure isolated dynamic-only host
        shell: bash
        run: |
          cmake -S duckdb -B build/bridge -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DOVERRIDE_GIT_DESCRIBE=v2.0.0 \
            -DDUCKDB_EXTENSION_CONFIGS="$PWD/test/extension_config_bridge.cmake" \
            -DPAIMON_ENABLE_OSS=OFF -DPAIMON_ENABLE_S3=OFF -DPAIMON_ENABLE_REST=OFF \
            -DENABLE_UNITTEST_CPP_TESTS=OFF 2>&1 | tee bridge-configure.log
      - name: Build and test real hidden producer
        shell: bash
        run: cmake --build build/bridge --target paimon_check_bound_read_bridge 2>&1 | tee bridge-build.log
      - name: Record binary provenance
        shell: bash
        run: |
          git rev-parse HEAD
          git submodule status
          "$CXX" --version
          cmake -E sha256sum build/bridge/test/unittest_paimon_bridge build/bridge/src/libduckdb.* build/bridge/extension/paimon/paimon.duckdb_extension
      - name: Reject no tests and failed child processes
        shell: bash
        run: |
          if cmake -DTEST_BINARY="$PWD/build/bridge/test/unittest_paimon_bridge" -DTEST_FILTER='[missing-bridge-case]' -DTEST_ROOT="$PWD/build/bridge/negative-no-tests" -P test/cpp/run_snapshot_binding.cmake; then
            exit 1
          fi
          if cmake -DTEST_BINARY=/usr/bin/false -DTEST_ROOT="$PWD/build/bridge/negative-child" -P test/cpp/run_snapshot_binding.cmake; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-dynamic-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/bridge/CMakeCache.txt
            build/bridge/compile_commands.json
            build/bridge/extension/paimon/bridge-test-work/
            build/bridge/extension/paimon/paimon-cpp-build/CMakeCache.txt
            build/bridge/negative-*/
            bridge-toolchain.log
            bridge-configure.log
            bridge-build.log
          if-no-files-found: warn
