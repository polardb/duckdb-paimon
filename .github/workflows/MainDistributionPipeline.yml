#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: 88ecd0a49d7d3d838e002b2fbc0ce91ccf74110e
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: paimon
      exclude_archs: 'linux_amd64_musl;osx_amd64;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      test_config: '{"test_env_variables":{"VCPKG_OVERLAY_TRIPLETS":"/duckdb_build_dir/vcpkg-triplets"}}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: 88ecd0a49d7d3d838e002b2fbc0ce91ccf74110e
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: paimon
      format_checks: 'format'
