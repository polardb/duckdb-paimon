#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: 88ecd0a49d7d3d838e002b2fbc0ce91ccf74110e
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: paimon
      exclude_archs: 'linux_amd64_musl;osx_amd64;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      test_config: '{"test_env_variables":{"VCPKG_OVERLAY_TRIPLETS":"/duckdb_build_dir/vcpkg-triplets"}}'

  code-quality-check:
    name: Code Quality Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.18'
      # The v2 formatter puts its Python directory first on PATH. An isolated
      # environment keeps that directory's clang-format aligned with the pin.
      - name: Format Check
        run: >-
          uv run --no-project --with black==24.10.0
          --with clang_format==11.0.1 --with cmake-format==0.6.13
          make format-check
